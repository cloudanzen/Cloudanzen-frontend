name: Secret Scan

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gitleaks detect --source . --redact --exit-code 1 \
              --log-opts="${{ github.event.pull_request.base.sha }}..HEAD"
          else
            gitleaks detect --source . --redact --exit-code 1 \
              --log-opts="HEAD~1..HEAD"
          fi

  trufflehog:
    name: TruffleHog Deep Scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified --results=verified
