name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Quality baseline checks
        run: npm run quality:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --coverage --coverage.reporter=json-summary --coverage.reporter=lcov --coverage.reporter=text-summary

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          if-no-files-found: error

  smoke-e2e:
    name: Smoke E2E
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run smoke tests
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test --grep @smoke
